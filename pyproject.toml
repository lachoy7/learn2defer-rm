[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn2defer-rm"
version = "0.1.0"
description = "Learn-to-defer routing between scalar and generative reward models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.0.0",
    "torch",
    "tqdm>=4.66.0",
    "transformers>=4.45.0",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
modal = ["modal>=0.70.0"]
gpu = ["vllm==0.15.1"]

[tool.setuptools.packages.find]
where = ["src"]
